[package]
name = "exoplanets"
version = "0.1.1"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "The known exoplanets in your terminal: 5,981 worlds plotted by size against orbit, with their systems. Part of the Fe2O3 suite."
license = "Unlicense"
repository = "https://github.com/isene/exoplanets"

[dependencies]
crust = { version = "0.1.46", path = "../crust", package = "fe2o3-crust" }

[profile.release]
opt-level = 3
lto = true
strip = true
